<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Spend Calculator</title>
</head>
<body>
  <h1>Campus Spend Calculator</h1>

  <label for="studentName">Your name</label>
  <input type="text" id="studentName">

  <label for="taxiFare">Taxi fare per trip (R)</label>
  <input type="number" id="taxiFare">

  <label for="tripsPerDay">Trips per day</label>
  <input type="number" id="tripsPerDay">

  <label for="lunchCost">Lunch cost per day (R)</label>
  <input type="number" id="lunchCost">

  <label for="campusDays">Days on campus per week</label>
  <input type="number" id="campusDays">

  <button id="calcBtn">Calculate</button>
  <button id="clearBtn">Clear</button>

  <p id="result"></p>
  <p id="count"></p>
  <ul id="history"></ul>

  <script src="js/script.js"></script>
</body>
</html>
